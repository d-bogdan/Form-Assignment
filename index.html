<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <title>WEB1 forms</title>
</head>
<body>
    <form action="http://www.no-where.com/formhandler.php" method="get">
        <fieldset>
            <legend>My Form</legend>
            <label>First name:
                <input type="text" name="firstNameField" id="firstNameField" placeholder="Type here" minlength="2" maxlength="20" required>
            </label>
            <label>Last name:
                <input type="text" name="lastNameField" id="lastNameField" placeholder="Type here" minlength="3" maxlength="20" required>
            </label>
            <label>Passport number:
                <input type="text" name="passportField" id="passportField" placeholder="Type here" minlength="3" maxlength="9" required>
            </label>
            <label>Emergency contact:
                <input type="text" name="emergencyField" id="emergencyField" placeholder="First and Last name" minlength="3" maxlength="41" required>
            </label>
            <label>Emergency contact phone number:
                <input type="text" name="emergencyPhoneField" id="emergencyPhoneField" placeholder="enter phone number" pattern="[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}" required/>
            </label>
            <p>Continents visited</p>
            <input type="checkbox" id="continent1" name="continent1 value="check1">
            <label for="check1">Asia</label>
            
            <input type="checkbox" id="continent2" name="continent2" value="check2">         
            <label for="check2">Africa</label>   
            
            <input type="checkbox" id="continent3" name="continent3" value="check3">
            <label for="check3">North America</label>

            <input type="checkbox" id="continent4" name="continent4" value="check3">
            <label for="check4">South America</label>

            <input type="checkbox" id="continent5" name="continent5" value="check3">
            <label for="check5">Antarctica</label>

            <input type="checkbox" id="continent6" name="continent6" value="check3">
            <label for="check6">Europe</label>

            <input type="checkbox" id="continent7" name="continent7" value="check3">
            <label for="check7">Australia</label>

            <h3>Languages Spoken</h3>

            <!-- Group 1: Common Languages -->
            <details class="lang">
                <summary class="summary">
                    Common Languages
                </summary>
                <!-- display: flex with wrap allows items to sit side-by-side if there is room -->
                <div class="lang_selection">
                    <label><input type="checkbox" id="lang-english" name="languages" value="english"> English</label>
                    <label><input type="checkbox" id="lang-spanish" name="languages" value="spanish"> Spanish</label>
                    <label><input type="checkbox" id="lang-french" name="languages" value="french"> French</label>
                </div>
            </details>

            <!-- Group 2: European Languages -->
            <details class="lang">
                <summary class="summary">
                    European Languages
                </summary>
                <div class="lang_selection">
                    <label><input type="checkbox" id="lang-german" name="languages" value="german"> German</label>
                    <label><input type="checkbox" id="lang-italian" name="languages" value="italian"> Italian</label>
                    <label><input type="checkbox" id="lang-portuguese" name="languages" value="portuguese"> Portuguese</label>
                    <label><input type="checkbox" id="lang-russian" name="languages" value="russian"> Russian</label>
                    <label><input type="checkbox" id="lang-polish" name="languages" value="polish"> Polish</label>
                    <label><input type="checkbox" id="lang-dutch" name="languages" value="dutch"> Dutch</label>
                    <label><input type="checkbox" id="lang-ukrainian" name="languages" value="ukrainian"> Ukrainian</label>
                    <label><input type="checkbox" id="lang-greek" name="languages" value="greek"> Greek</label>
                    <label><input type="checkbox" id="lang-swedish" name="languages" value="swedish"> Swedish</label>
                </div>
            </details>

            <!-- Group 3: Asian & Middle Eastern Languages -->
            <details class="lang">
                <summary class="summary">
                    Asian & Middle Eastern Languages
                </summary>
                <div class="lang_selection">
                    <label><input type="checkbox" id="lang-mandarin" name="languages" value="mandarin"> Mandarin Chinese</label>
                    <label><input type="checkbox" id="lang-hindi" name="languages" value="hindi"> Hindi</label>
                    <label><input type="checkbox" id="lang-arabic" name="languages" value="arabic"> Arabic</label>
                    <label><input type="checkbox" id="lang-bengali" name="languages" value="bengali"> Bengali</label>
                    <label><input type="checkbox" id="lang-japanese" name="languages" value="japanese"> Japanese</label>
                    <label><input type="checkbox" id="lang-punjabi" name="languages" value="punjabi"> Punjabi</label>
                    <label><input type="checkbox" id="lang-korean" name="languages" value="korean"> Korean</label>
                    <label><input type="checkbox" id="lang-vietnamese" name="languages" value="vietnamese"> Vietnamese</label>
                    <label><input type="checkbox" id="lang-urdu" name="languages" value="urdu"> Urdu</label>
                    <label><input type="checkbox" id="lang-turkish" name="languages" value="turkish"> Turkish</label>
                    <label><input type="checkbox" id="lang-tagalog" name="languages" value="tagalog"> Tagalog / Filipino</label>
                    <label><input type="checkbox" id="lang-thai" name="languages" value="thai"> Thai</label>
                    <label><input type="checkbox" id="lang-persian" name="languages" value="persian"> Persian (Farsi)</label>
                </div>
            </details>

    </fieldset>
</body>
</html>
