<!DOCTYPE html>

    <title>WEB1 forms</title>

<body>
    <form action="http://www.no-where.com/formhandler.php" method="get">
        <fieldset>
            <legend>My Form</legend>
            <label>First name:
                <input type="text" name="firstNameField" id="firstNameField" placeholder="Type here" minlength="2" maxlength="20" required>
            </label>
            <label>Last name:
                <input type="text" name="lastNameField" id="lastNameField" placeholder="Type here" minlength="3" maxlength="20" required>
            </label>
            <label>passport number:
                <input type="text" name="passportField" id="passportField" placeholder="Type here" minlength="3" maxlength="9" required>
            </label>
            <label>emergency contact:
                <input type="text" name="emergencyField" id="emergencyField" placeholder="First and Last name" minlength="3" maxlength="41" required>
            </label>
            <label>Emergency contact phone number:
                <input type="text" name="emergencyPhoneField" id="emergencyPhoneField" placeholder="enter phone number" pattern="[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}" required/>
            </label>
            <p>continents visited</p>
            <input type="checkbox" id="continent1" name="continent1 value="check1">
            <label for="check1">Asia</label>
            
            <input type="checkbox" id="continent2" name="continent2" value="check2">         
            <label for="check2">Africa</label>   
            
            <input type="checkbox" id="continent3" name="continent3" value="check3">
            <label for="check3">North America</label>

            <label for="check4">South America</label>

            <label for="check5">Antarctica</label>

            <input type="checkbox" id="continent6" name="continent6" value="check3">
            <label for="check6">Europe</label>

            <input type="checkbox" id="continent7" name="continent7" value="check3">
            <label for="check7">Australia</label>
