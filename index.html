<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <title>WEB1 forms</title>
</head>
<body>
    <form action="http://www.no-where.com/formhandler.php" method="get">
        <fieldset>
            <legend>My Form</legend>
            <label>First name:
                <input type="text" name="firstNameField" id="firstNameField" placeholder="Type here" minlength="2" maxlength="20" required>
            </label>
            <label>Last name:
                <input type="text" name="lastNameField" id="lastNameField" placeholder="Type here" minlength="3" maxlength="20" required>
            </label>
            <label>Passport number:
                <input type="text" name="passportField" id="passportField" placeholder="Type here" minlength="3" maxlength="9" required>
            </label>
            <label>Emergency contact:
                <input type="text" name="emergencyField" id="emergencyField" placeholder="First and Last name" minlength="3" maxlength="41" required>
            </label>
            <label>Emergency contact phone number:
                <input type="text" name="emergencyPhoneField" id="emergencyPhoneField" placeholder="enter phone number" pattern="[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}" required/>
            </label>
            <p>Continents visited</p>
            <input type="checkbox" id="continent1" name="continent1 value="check1">
            <label for="check1">Asia</label>
            
            <input type="checkbox" id="continent2" name="continent2" value="check2">         
            <label for="check2">Africa</label>   
            
            <input type="checkbox" id="continent3" name="continent3" value="check3">
            <label for="check3">North America</label>

            <input type="checkbox" id="continent4" name="continent4" value="check3">
            <label for="check4">South America</label>

            <input type="checkbox" id="continent5" name="continent5" value="check3">
            <label for="check5">Antarctica</label>

            <input type="checkbox" id="continent6" name="continent6" value="check3">
            <label for="check6">Europe</label>

            <input type="checkbox" id="continent7" name="continent7" value="check3">
            <label for="check7">Australia</label>

            <h3>Languages Spoken</h3>

            <!-- Group 1: Common Languages -->
            <details class="lang">
                <summary class="summary">
                    Common Languages
                </summary>
                <!-- display: flex with wrap allows items to sit side-by-side if there is room -->
                <div class="lang_selection">
                    <label><input type="checkbox" id="lang-english" name="languages" value="english"> English</label>
                    <label><input type="checkbox" id="lang-spanish" name="languages" value="spanish"> Spanish</label>
                    <label><input type="checkbox" id="lang-french" name="languages" value="french"> French</label>
                </div>
            </details>

            <!-- Group 2: European Languages -->
            <details class="lang">
                <summary class="summary">
                    European Languages
                </summary>
                <div class="lang_selection">
                    <label><input type="checkbox" id="lang-german" name="languages" value="german"> German</label>
                    <label><input type="checkbox" id="lang-italian" name="languages" value="italian"> Italian</label>
                    <label><input type="checkbox" id="lang-portuguese" name="languages" value="portuguese"> Portuguese</label>
                    <label><input type="checkbox" id="lang-russian" name="languages" value="russian"> Russian</label>
                    <label><input type="checkbox" id="lang-polish" name="languages" value="polish"> Polish</label>
                    <label><input type="checkbox" id="lang-dutch" name="languages" value="dutch"> Dutch</label>
                    <label><input type="checkbox" id="lang-ukrainian" name="languages" value="ukrainian"> Ukrainian</label>
                    <label><input type="checkbox" id="lang-greek" name="languages" value="greek"> Greek</label>
                    <label><input type="checkbox" id="lang-swedish" name="languages" value="swedish"> Swedish</label>
                    <label><input type="checkbox" name="languages" value="other"> Other</label>
                </div>
            </details>

            <!-- Group 3: Asian & Middle Eastern Languages -->
            <details class="lang">
                <summary class="summary">
                    Asian & Middle Eastern Languages
                </summary>
                <div class="lang_selection">
                    <label><input type="checkbox" id="lang-mandarin" name="languages" value="mandarin"> Mandarin Chinese</label>
                    <label><input type="checkbox" id="lang-hindi" name="languages" value="hindi"> Hindi</label>
                    <label><input type="checkbox" id="lang-arabic" name="languages" value="arabic"> Arabic</label>
                    <label><input type="checkbox" id="lang-bengali" name="languages" value="bengali"> Bengali</label>
                    <label><input type="checkbox" id="lang-japanese" name="languages" value="japanese"> Japanese</label>
                    <label><input type="checkbox" id="lang-punjabi" name="languages" value="punjabi"> Punjabi</label>
                    <label><input type="checkbox" id="lang-korean" name="languages" value="korean"> Korean</label>
                    <label><input type="checkbox" id="lang-vietnamese" name="languages" value="vietnamese"> Vietnamese</label>
                    <label><input type="checkbox" id="lang-urdu" name="languages" value="urdu"> Urdu</label>
                    <label><input type="checkbox" id="lang-turkish" name="languages" value="turkish"> Turkish</label>
                    <label><input type="checkbox" id="lang-tagalog" name="languages" value="tagalog"> Tagalog / Filipino</label>
                    <label><input type="checkbox" id="lang-thai" name="languages" value="thai"> Thai</label>
                    <label><input type="checkbox" id="lang-persian" name="languages" value="persian"> Persian (Farsi)</label>
                    <label><input type="checkbox" name="languages" value="other"> Other</label>
                </div>
            </details>
        <p>How do you like to travel?</p>
            <input type="radio" id="solo" value="solo" name="groupSize">
            <label for="solo">solo</label>
            <input type="radio" id="pair" value="pair" name="groupSize">
            <label for="pair">pair</label>
            <input type="radio" id="group" value="group" name="groupSize">
            <label for="group">group (>2)</label>
        <p>Nationality</p>
        <select name="nationality" id="nationality" required>
            <option value="" disabled selected>Select nationality</option>

            <optgroup label="Europe">
                <option value="austrian">Austrian</option>
                <option value="belgian">Belgian</option>
                <option value="british">British</option>
                <option value="bulgarian">Bulgarian</option>
                <option value="croatian">Croatian</option>
                <option value="czech">Czech</option>
                <option value="danish">Danish</option>
                <option value="dutch">Dutch</option>
                <option value="finnish">Finnish</option>
                <option value="french">French</option>
                <option value="german">German</option>
                <option value="greek">Greek</option>
                <option value="hungarian">Hungarian</option>
                <option value="irish">Irish</option>
                <option value="italian">Italian</option>
                <option value="Moldovian">Moldovian</option>
                <option value="norwegian">Norwegian</option>
                <option value="polish">Polish</option>
                <option value="portuguese">Portuguese</option>
                <option value="romanian">Romanian</option>
                <option value="spanish">Spanish</option>
                <option value="swedish">Swedish</option>
                <option value="swiss">Swiss</option>
                <option value="ukrainian">Ukrainian</option>
            </optgroup>

            <optgroup label="Asia">
                <option value="afghan">Afghan</option>
                <option value="bangladeshi">Bangladeshi</option>
                <option value="chinese">Chinese</option>
                <option value="filipino">Filipino</option>
                <option value="indian">Indian</option>
                <option value="indonesian">Indonesian</option>
                <option value="iranian">Iranian</option>
                <option value="iraqi">Iraqi</option>
                <option value="israeli">Israeli</option>
                <option value="japanese">Japanese</option>
                <option value="kazakh">Kazakh</option>
                <option value="korean">Korean</option>
                <option value="malaysian">Malaysian</option>
                <option value="pakistani">Pakistani</option>
                <option value="saudi">Saudi</option>
                <option value="singaporean">Singaporean</option>
                <option value="taiwanese">Taiwanese</option>
                <option value="thai">Thai</option>
                <option value="turkish">Turkish</option>
                <option value="vietnamese">Vietnamese</option>
            </optgroup>

            <optgroup label="Americas">
                <option value="american">American</option>
                <option value="argentine">Argentine</option>
                <option value="brazilian">Brazilian</option>
                <option value="canadian">Canadian</option>
                <option value="chilean">Chilean</option>
                <option value="colombian">Colombian</option>
                <option value="mexican">Mexican</option>
                <option value="peruvian">Peruvian</option>
            </optgroup>

            <optgroup label="Africa">
                <option value="egyptian">Egyptian</option>
                <option value="ethiopian">Ethiopian</option>
                <option value="ghanaian">Ghanaian</option>
                <option value="kenyan">Kenyan</option>
                <option value="moroccan">Moroccan</option>
                <option value="nigerian">Nigerian</option>
                <option value="south-african">South African</option>
            </optgroup>

            <optgroup label="Oceania">
                <option value="australian">Australian</option>
                <option value="new-zealander">New Zealander</option>
            </optgroup>

            <option value="other">Other</option>
        </select>
        <p>Currency</p>
        <select name="currency" id="currency" required>
            <option value="" disabled selected>Select currency</option>

            <optgroup label="Europe">
                <option value="EUR">EUR - Euro (€)</option>
                <option value="GBP">GBP - British Pound (£)</option>
                <option value="CHF">CHF - Swiss Franc (CHF)</option>
                <option value="CZK">CZK - Czech Koruna (Kč)</option>
                <option value="DKK">DKK - Danish Krone (kr)</option>
                <option value="HUF">HUF - Hungarian Forint (Ft)</option>
                <option value="NOK">NOK - Norwegian Krone (kr)</option>
                <option value="PLN">PLN - Polish Złoty (zł)</option>
                <option value="RON">RON - Romanian Leu (lei)</option>
                <option value="SEK">SEK - Swedish Krona (kr)</option>
                <option value="TRY">TRY - Turkish Lira (₺)</option>
            </optgroup>

            <optgroup label="Asia">
                <option value="AED">AED - UAE Dirham (AED)</option>
                <option value="CNY">CNY - Chinese Yuan (¥)</option>
                <option value="HKD">HKD - Hong Kong Dollar (HK$)</option>
                <option value="IDR">IDR - Indonesian Rupiah (Rp)</option>
                <option value="ILS">ILS - Israeli New Shekel (₪)</option>
                <option value="INR">INR - Indian Rupee (₹)</option>
                <option value="JPY">JPY - Japanese Yen (¥)</option>
                <option value="KRW">KRW - South Korean Won (₩)</option>
                <option value="MYR">MYR - Malaysian Ringgit (RM)</option>
                <option value="PHP">PHP - Philippine Peso (₱)</option>
                <option value="PKR">PKR - Pakistani Rupee (₨)</option>
                <option value="SAR">SAR - Saudi Riyal (SAR)</option>
                <option value="SGD">SGD - Singapore Dollar (S$)</option>
                <option value="THB">THB - Thai Baht (฿)</option>
                <option value="VND">VND - Vietnamese Dong (₫)</option>
            </optgroup>

            <optgroup label="Americas">
                <option value="USD">USD - US Dollar ($)</option>
                <option value="CAD">CAD - Canadian Dollar (CA$)</option>
                <option value="BRL">BRL - Brazilian Real (R$)</option>
                <option value="MXN">MXN - Mexican Peso ($)</option>
                <option value="ARS">ARS - Argentine Peso ($)</option>
                <option value="CLP">CLP - Chilean Peso ($)</option>
                <option value="COP">COP - Colombian Peso ($)</option>
                <option value="PEN">PEN - Peruvian Sol (S/.)</option>
            </optgroup>

            <optgroup label="Africa">
                <option value="EGP">EGP - Egyptian Pound (E£)</option>
                <option value="GHS">GHS - Ghanaian Cedi (GH₵)</option>
                <option value="KES">KES - Kenyan Shilling (KSh)</option>
                <option value="MAD">MAD - Moroccan Dirham (MAD)</option>
                <option value="NGN">NGN - Nigerian Naira (₦)</option>
                <option value="ZAR">ZAR - South African Rand (R)</option>
            </optgroup>

            <optgroup label="Oceania">
                <option value="AUD">AUD - Australian Dollar (A$)</option>
                <option value="FJD">FJD - Fijian Dollar (FJ$)</option>
                <option value="NZD">NZD - New Zealand Dollar (NZ$)</option>
            </optgroup>

            <option value="other">Other</option>
        </select>
    </fieldset>
</body>
</html>
